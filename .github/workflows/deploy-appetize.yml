name: Deploy to Appetize

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Install Android SDK 34
      run: |
        set -euo pipefail
        mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
        curl -fsSL -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q /tmp/commandlinetools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
        rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
        mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
        yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
        "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" \
          "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Upload to Appetize.io
      id: appetize
      if: env.APPETIZE_TOKEN != ''
      uses: appetizeio/github-action-appetize@v1.1.0
      with:
        apiToken: ${{ secrets.APPETIZE_TOKEN }}
        appFile: app/build/outputs/apk/debug/app-debug.apk
        platform: android

    - name: Write preview link
      if: steps.appetize.outputs.publicKey != ''
      run: |
        {
          echo "### Appetize preview"
          echo "https://appetize.io/app/${{ steps.appetize.outputs.publicKey }}"
        } >> "$GITHUB_STEP_SUMMARY"
